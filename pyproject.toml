[project]
name = "ana-agents"
version = "0.1.0"
description = "Canonical contracts and deterministic validation foundation for evidence-grounded Ana brand-partnership outreach."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
    # Active `format` checking: jsonschema silently skips `date-time` / `uri`
    # checks when these optional checkers are absent. The registry asserts at
    # load time that both checkers are active (see ADR-003).
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ana_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
