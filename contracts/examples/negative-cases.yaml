      - { op: set, artifact: sr-001, path: /sent_at, value: "2026-10-03T10:00:00Z" }
    expect:
      - { code: CHAIN_SEND_OUTSIDE_PERMISSION_WINDOW, artifact: sr-001 }

  - id: NEG-SP-013
    requirement_ids: [OPS-002]
    description: send receipt for a permission that did not authorize sending
    base: chains/valid-send-chain.json
    ops:
      - { op: set, artifact: sp-001, path: /send_authorized, value: false }
      - { op: set, artifact: sp-001, path: /block_reasons, value: [compliance NOT_CONFIGURED] }
    expect:
      - { code: CHAIN_SEND_WITHOUT_AUTHORIZATION, artifact: sr-001 }

  - id: NEG-SP-014
    requirement_ids: [OPS-002]
