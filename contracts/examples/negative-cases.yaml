  - id: NEG-SP-010
    requirement_ids: [DATA-004, OPS-002]
    description: freshness NOT_EVALUATED with send_authorized=true
    base: chains/valid-send-chain.json
    ops:
      - { op: set, artifact: sp-001, path: /gates/freshness, value: NOT_EVALUATED }
    expect:
      - { code: SEM_SEND_GATE_FRESHNESS, artifact: sp-001 }

  - id: NEG-SP-011
    requirement_ids: [OPS-002]
    description: unconsumed SendPermission evaluated after expiry
    base: chains/valid-send-chain.json
    ops:
      - { op: drop, artifact: or-001 }
      - { op: drop, artifact: rh-001 }
      - { op: drop, artifact: sr-001 }
      - { op: set_now, value: "2026-10-03T09:05:00Z" }
    expect:
      - { code: SEM_SEND_PERMISSION_EXPIRED, artifact: sp-001 }

  - id: POS-SP-011
    requirement_ids: [OPS-002]
    description: control - the same unconsumed permission one second before expiry
    base: chains/valid-send-chain.json
    ops:
      - { op: drop, artifact: or-001 }
      - { op: drop, artifact: rh-001 }
      - { op: drop, artifact: sr-001 }
      - { op: set_now, value: "2026-10-03T09:04:59Z" }
    expect: []

  - id: NEG-SP-012
    requirement_ids: [OPS-002]
