    base: chains/valid-send-denied-chain.json
    ops:
      - { op: set, artifact: sp-001, path: /block_reasons, value: [] }
    expect:
      - { code: SEM_SEND_PERMISSION_INCONSISTENT, artifact: sp-001 }

  - id: NEG-SP-015
    requirement_ids: [OPS-002]
