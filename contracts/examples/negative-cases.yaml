  - id: NEG-SR-001
    requirement_ids: [OPS-002]
    description: SendReceipt claiming adapter_mode NOT_CONFIGURED (no adapter means no send and no receipt)
    base: chains/valid-send-chain.json
    ops:
      - { op: set, artifact: sr-001, path: /adapter_mode, value: NOT_CONFIGURED }
